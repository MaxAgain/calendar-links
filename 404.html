<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Nicht gefunden · Solakon</title>
  <script>
    (function () {
      // Site root: "/<repo>/" on <owner>.github.io project sites, "/" on a custom domain.
      var seg = location.pathname.split('/').filter(Boolean)[0];
      var base = /\.github\.io$/i.test(location.hostname) && seg && seg !== 'e' ? '/' + seg + '/' : '/';

      // Tolerate links written as /e/<id> instead of /e/?id=<id>.
      var match = /\/e\/([a-z0-9-]{1,64})\/?$/i.exec(location.pathname);
      if (match) {
        var extra = location.search ? '&' + location.search.slice(1) : '';
        location.replace(base + 'e/?id=' + match[1].toLowerCase() + extra);
        return;
      }
      ['assets/css/tokens.css', 'assets/css/landing.css'].forEach(function (href) {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = base + href;
        document.head.appendChild(link);
      });
    })();
  </script>
</head>
<body>
  <header class="band"><div class="band__inner"><a class="wordmark" href="https://solakon.de">SOLAKON</a></div></header>
  <main>
    <div class="card">
      <h1>Seite nicht gefunden</h1>
      <p>Dieser Link ist ungültig. / This link is invalid.</p>
      <p><a href="https://solakon.de">Zur Website / Go to website →</a></p>
    </div>
  </main>
</body>
</html>
